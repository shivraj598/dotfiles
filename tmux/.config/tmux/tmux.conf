# ==============================================================================
# TMUX CONFIGURATION
# macOS + Lazyvim + Full-Stack Development
#
# Prefix: Ctrl + a
#
# Recommended project structure:
#   1:editor    Lazyvim
#   2:servers   Frontend and backend development servers
#   3:docker    Docker Compose, logs, and database
#   4:agent     Claude Code, OpenCode, Pi, etc.
#   5:shell     General project terminal
# ==============================================================================


# ==============================================================================
# SHELL AND TERMINAL
# ==============================================================================

# Use zsh as the default shell.
set-option -g default-shell /bin/zsh
set-option -g default-command /bin/zsh

# Use tmux-256color for better Unicode and Nerd Font support.
# This is more modern than screen-256color and properly handles UTF-8.
set-option -g default-terminal "tmux-256color"

# Enable RGB True Color for Ghostty.
set-option -sa terminal-overrides ",tmux-256color:RGB,tmux-256color:Tc"

# Allow Ghostty's background image to show through tmux panes.
set-option -g window-style default
set-option -g window-active-style default

# Enable terminal focus events for AstroNvim and other terminal applications.
set-option -g focus-events on

# Allow applications to use terminal passthrough sequences.
# Useful for modern terminal features and terminal image previews.
set-option -g allow-passthrough on

# Allow tmux and supported terminal applications to access the clipboard.
set-option -g set-clipboard on


# ==============================================================================
# GENERAL BEHAVIOR
# ==============================================================================

# Enable mouse support for selecting panes, resizing, and scrolling.
set-option -g mouse on

# Remove the escape-key delay.
# This makes exiting insert mode in AstroNvim feel immediate.
set-option -sg escape-time 0

# Keep a large but reasonable amount of terminal history per pane.
set-option -g history-limit 100000

# Update the status bar every five seconds.
set-option -g status-interval 5

# Keep the tmux client open and move to another session when the current
# session is destroyed.
set-option -g detach-on-destroy off

# Display pane numbers slightly longer when using the pane display command.
set-option -g display-panes-time 1500

# Display tmux messages for three seconds.
set-option -g display-time 3000

# Increase repeat time for repeatable resize commands.
set-option -g repeat-time 500

# Prevent tmux from automatically renaming windows based on running programs.
# Project windows will have predictable names such as editor and servers.
set-window-option -g automatic-rename off

# Prevent terminal applications from unexpectedly changing tmux window names.
set-option -g allow-rename off

# Notify terminal applications when pane focus changes.
set-window-option -g focus-events on

# Keep the status bar enabled.
set-option -g status on


# ==============================================================================
# PREFIX
# ==============================================================================

# Remove the default Ctrl+b prefix.
unbind-key C-b

# Use Ctrl+a as the only tmux prefix.
set-option -g prefix C-a
set-option -g prefix2 None

# Press Ctrl+a, followed by Ctrl+a, to send Ctrl+a to the
# application running inside the active pane.
#
# This is useful if AstroNvim, Neovim, or another terminal application has
# its own Ctrl+a keybinding.
bind-key C-a send-prefix


# ==============================================================================
# CONFIGURATION RELOAD
# ==============================================================================

# Prefix + r reloads this configuration and shows a confirmation message.
unbind-key r
bind-key r source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux configuration reloaded"


# ==============================================================================
# GENERAL OPTIONS
# ==============================================================================

# Start window numbering from 1.
set-option -g base-index 1

# Start pane numbering from 1.
set-window-option -g pane-base-index 1

# Renumber windows automatically after one is closed.
set-option -g renumber-windows on


# ==============================================================================
# WINDOW MANAGEMENT
# ==============================================================================

# Prefix + c creates a new window in the active pane's current directory.
unbind-key c
bind-key c new-window -c "#{pane_current_path}"

# Prefix + , renames the current window.
unbind-key ","
bind-key "," command-prompt -I "#W" "rename-window '%%'"

# Prefix + X closes the selected window after confirmation.
bind-key X confirm-before -p "Close window #I:#W? (y/n)" kill-window

# Prefix + & closes all windows and kills the session.
bind-key "&" confirm-before -p "Kill session #S? (y/n)" kill-session


# ==============================================================================
# WINDOW NAVIGATION
# ==============================================================================

# Prefix + 1 through 5 directly selects the corresponding project window.
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5

# Prefix + n moves to the next window.
unbind-key n
bind-key n next-window

# Prefix + p moves to the previous window.
unbind-key p
bind-key p previous-window

# Prefix + Tab switches between the current and previously selected window.
bind-key Tab last-window

# Prefix + Shift+Left moves the active window one position left.
bind-key -r S-Left swap-window -d -t -1

# Prefix + Shift+Right moves the active window one position right.
bind-key -r S-Right swap-window -d -t +1

# Prefix + w opens the native tmux window selector.
unbind-key w
bind-key w choose-tree -Zw


# ==============================================================================
# SESSIONS
# ==============================================================================

# Prefix + s opens the native tmux session selector.
unbind-key s
bind-key s choose-tree -Zs

# Prefix + $ renames the current session.
unbind-key "$"
bind-key "$" command-prompt -I "#S" "rename-session '%%'"

# Prefix + d detaches from the current session.
# (default tmux binding, kept for reference)
# bind-key d detach-client


# ==============================================================================
# PANES
# ==============================================================================

# Prefix + \ creates a horizontal split.
# The resulting panes appear side by side.
unbind-key "%"
bind-key "\\" split-window -h -c "#{pane_current_path}"

# Prefix + - creates a vertical split.
# The resulting panes appear above and below each other.
unbind-key '"'
bind-key "-" split-window -v -c "#{pane_current_path}"

# Prefix + x closes the selected pane after confirmation.
unbind-key x
bind-key x confirm-before -p "Close pane #P? (y/n)" kill-pane

# Prefix + m toggles pane maximization (zoom).
unbind-key m
bind-key m resize-pane -Z

# Prefix + q displays pane numbers.
unbind-key q
bind-key q display-panes


# ==============================================================================
# PANE NAVIGATION
# ==============================================================================

# Ctrl+h, Ctrl+j, Ctrl+k, and Ctrl+l navigation is handled by
# vim-tmux-navigator.
#
# It provides seamless navigation between:
#   - lazyvimsplits
#   - tmux panes
#
# Ctrl+h    Move left
# Ctrl+j    Move down
# Ctrl+k    Move up
# Ctrl+l    Move right
#
# These navigation shortcuts do not require the tmux prefix.


# ==============================================================================
# PANE RESIZING
# ==============================================================================

# Use Prefix + Shift+H/J/K/L to resize panes.
#
# These bindings are repeatable. After pressing the prefix once, continue
# pressing H, J, K, or L to resize without pressing the prefix again.

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5


# ==============================================================================
# PANE LAYOUTS
# ==============================================================================

# Prefix + = distributes all panes using the tiled layout.
bind-key "=" select-layout tiled

# Prefix + | places panes side by side.
bind-key "|" select-layout even-horizontal

# Prefix + Space cycles through available pane layouts.
unbind-key Space
bind-key Space next-layout


# ==============================================================================
# PANE SYNCHRONIZATION
# ==============================================================================

# Prefix + y toggles synchronized input for every pane in the current window.
#
# This can be useful when running the same command in multiple containers or
# remote shells. Be careful when enabling it because every keystroke will be
# sent to all panes in the window.
bind-key y set-window-option synchronize-panes \; \
    display-message "Synchronized panes: #{?pane_synchronized,ON,OFF}"


# ==============================================================================
# CLIPBOARD & COPY MODE
# ==============================================================================

# Use Vim-style keys inside tmux copy mode.
set-window-option -g mode-keys vi

# Use Vim-style keys in tmux command prompts and menus.
set-option -g status-keys vi

# Prefix + [ enters copy mode.
# This is the default tmux binding and is intentionally preserved.

# v starts normal text selection.
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Ctrl+v toggles rectangular or block selection.
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y copies selected text to the macOS clipboard and exits copy mode.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Y selects the current line, copies it to the macOS clipboard, and exits.
bind-key -T copy-mode-vi Y send-keys -X select-line \; \
    send-keys -X copy-pipe-and-cancel "pbcopy"

# Escape exits copy mode.
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Prefix + P pastes the most recently copied tmux buffer.
bind-key P paste-buffer

# Do not automatically exit copy mode after completing a mouse drag.
unbind-key -T copy-mode-vi MouseDragEnd1Pane


# ==============================================================================
# STATUS BAR
# ==============================================================================

# Main status bar pinned to the very bottom edge (tmux always draws this as
# the last line — flush to the terminal edge, no margin option exists).
# Kept at bottom because SketchyBar occupies the top of the screen.
set-option -g status-position bottom

# Prefix + T toggles the main status bar between bottom and top edge.
bind-key T if-shell '[ "$(tmux display-message -p "#{status-position}")" = "bottom" ]' \
    'set-option -g status-position top \; display-message "status: top"' \
    'set-option -g status-position bottom \; display-message "status: bottom"'

# Prefix + G toggles the second (top-edge) bar on/off.
bind-key G if-shell '[ "$(tmux display-message -p "#{pane-border-status}")" = "off" ]' \
    'set-option -g pane-border-status top \; display-message "top bar: ON"' \
    'set-option -g pane-border-status off \; display-message "top bar: OFF"'

# True-center the window list like the reference (1:nvim 2:zsh 3:nvim).
set-option -g status-justify absolute-centre

# Full-bleed lengths so left/right pills touch the terminal edges.
set-option -g status-left-length 40
set-option -g status-right-length 60

# Transparent bar - every segment uses bg=default so Ghostty bg image shows through.
set-option -g status-style "fg=#e0def4,bg=default"

# Left: session + current dir in pink, transparent (no leading spaces).
set-option -g status-left "#[bg=default,fg=#9ccfd8,bold]🖕 #S #[fg=#524f67,bg=default]│#[fg=#eb6f92,bg=default,bold]  #{b:pane_current_path} "

# Right: wifi/state only (session removed - already shown on left).
set-option -g status-right "#[fg=#9ccfd8,bg=default] on "

# Thin divider between windows, transparent.
set-window-option -g window-status-separator "#[fg=#524f67,bg=default]│"

# Inactive window: dim text, transparent.
set-window-option -g window-status-format \
"#[bg=default,fg=#6e6a86] #I: #W "

# Active window: red text on green bg.
set-window-option -g window-status-current-format \
"#[bg=#7CFC00,fg=#c90707,bold] #I: #W#{?window_zoomed_flag, 󰍉,} "

# Message appearance, including reload confirmation.
set-option -g message-style "fg=#E7E7E7,bg=#2E3440,bold"

# Command prompt appearance (input bar).
# Clean, minimal styling matching terminal aesthetics.
set-option -g message-command-style "fg=#88C0D0,bg=#2E3440,bold"

# Copy-mode selection appearance.
set-window-option -g mode-style "fg=#3B4252,bg=#88C0D0,bold"

# Pane border styling for visual consistency.
set-option -g pane-border-style "fg=#2E3440"
set-option -g pane-active-border-style "fg=#A3BE8C"

# Top-edge bar OFF by default - use Prefix+G to show it.
# tmux only allows ONE status-position, so second edge is faked with pane borders.
set-option -g pane-border-status off
set-option -g pane-border-format \
" #[fg=#7CFC00,bold]#S #[fg=#00FFFF]#I:#W #[fg=#81A1C1]#{b:pane_current_path} #[fg=#ABB2BF]#P:#{pane_current_command}#{?window_zoomed_flag, 󰍉,} "


# ==============================================================================
# WINDOW ACTIVITY
# ==============================================================================

# Monitor windows for activity.
set-window-option -g monitor-activity on

# Do not display intrusive visual activity messages.
set-option -g visual-activity off

# Disable visual bell notifications.
set-option -g visual-bell off

# Disable audible terminal bells.
set-option -g bell-action none


# ==============================================================================
# PLUGINS
# ==============================================================================

# TPM: tmux Plugin Manager.
set-option -g @plugin "tmux-plugins/tpm"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins"

# Seamless navigation between AstroNvim splits and tmux panes.
set-option -g @plugin "christoomey/vim-tmux-navigator"

# Save and restore tmux sessions, windows, panes, and working directories.
set-option -g @plugin "tmux-plugins/tmux-resurrect"

# Automatically save tmux state periodically.
set-option -g @plugin "tmux-plugins/tmux-continuum"


# ==============================================================================
# VIM-TMUX-NAVIGATOR
# ==============================================================================

# Prevent the navigator plugin from changing pane behavior when a pane is
# zoomed.
set-option -g @vim_navigator_disable_when_zoomed 1

# Preserve the current zoom state when moving between panes.
set-option -g @vim_navigator_preserve_zoom 1


# ==============================================================================
# TMUX RESURRECT
# ==============================================================================

# Save the visible contents of panes.
set-option -g @resurrect-capture-pane-contents "on"

# Restore Neovim sessions using the default resurrect strategy.
set-option -g @resurrect-strategy-nvim "session"

# Restore supported development processes.
set-option -g @resurrect-processes "nvim vim docker claude opencode pi"

# ==============================================================================
# TMUX CONTINUUM
# ==============================================================================

# Save tmux state every 15 minutes.
set-option -g @continuum-save-interval "15"

# Automatic restoration is intentionally disabled initially.
# After everything works reliably, uncomment the following line:
#
# set-option -g @continuum-restore "on"


# ==============================================================================
# TPM INITIALIZATION
# Keep this at the very bottom of tmux.conf.
# ==============================================================================

if-shell '[ -x "$HOME/.config/tmux/plugins/tpm/tpm" ]' \
    'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"' \
    'display-message "TPM is not installed. Clone it into ~/.config/tmux/plugins/tpm"'