# AeroSpace config — ~/.config/aerospace/aerospace.toml (stowed from ~/dotfiles)
# Keep only this file; a second ~/.aerospace.toml makes the config location ambiguous.
# Options left at their defaults are omitted. Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

start-at-login = true
auto-reload-config = true
automatically-unhide-macos-hidden-apps = true

# JankyBorders (exits immediately if the brew service already runs it)
after-startup-command = ['exec-and-forget borders']

# SketchyBar listens for the custom event `aerospace_workspace_change`
exec-on-workspace-change = [
    '/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE="$AEROSPACE_FOCUSED_WORKSPACE" PREV_WORKSPACE="$AEROSPACE_PREV_WORKSPACE"',
]

# I = IDE, B = Browser, T = Terminal, N = Notes, S = Socials, A = AI, 1-2 = spare
# Keep in sync with workspace_names in sketchybar/items/spaces.lua
persistent-workspaces = ['I', 'B', 'T', 'N', 'S', 'A', '1', '2']

# Mouse follows keyboard focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = 'move-mouse window-lazy-center'


# ---------- Gaps ----------

[gaps]
inner.horizontal = 12
inner.vertical = 12
outer.left = 14
outer.bottom = 10
outer.right = 14
outer.top = [{ monitor."Built-in Retina Display" = 12 }, 45]


# ---------- Main mode (Option = alt) ----------

[mode.main.binding]

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-equal = 'balance-sizes'

# Focus / move
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize (alt-equal is taken by balance-sizes, so grow is alt-shift-equal)
alt-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Switch workspace
alt-i = 'workspace I'
alt-b = 'workspace B'
alt-t = 'workspace T'
alt-n = 'workspace N'
alt-s = 'workspace S'
alt-a = 'workspace A'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'

# Move window to workspace and follow it
alt-shift-i = 'move-node-to-workspace I --focus-follows-window'
alt-shift-b = 'move-node-to-workspace B --focus-follows-window'
alt-shift-t = 'move-node-to-workspace T --focus-follows-window'
alt-shift-n = 'move-node-to-workspace N --focus-follows-window'
alt-shift-s = 'move-node-to-workspace S --focus-follows-window'
alt-shift-a = 'move-node-to-workspace A --focus-follows-window'
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'


# ---------- Service mode (every key returns to main) ----------

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']


