# ---------- Workspace -> monitor ----------
# Must stay last: every key below a [table] header belongs to that table.

[workspace-to-monitor-force-assignment]
# Always on the MacBook display
I = 'Built-in Retina Display'
B = 'Built-in Retina Display'
T = 'Built-in Retina Display'
S = 'Built-in Retina Display'
# External monitor if connected, otherwise the MacBook
N = ['secondary', 'Built-in Retina Display']
A = ['secondary', 'Built-in Retina Display']
1 = ['secondary', 'Built-in Retina Display']
2 = ['secondary', 'Built-in Retina Display']
