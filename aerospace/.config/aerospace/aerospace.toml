# ============================================================
# WORKSPACE TO MONITOR ASSIGNMENT
# IMPORTANT: KEEP THIS AT THE ABSOLUTE BOTTOM OF THE FILE
# ============================================================

[workspace-to-monitor-force-assignment]

# Always use the MacBook display.
I = 'Built-in Retina Display'
B = 'Built-in Retina Display'
T = 'Built-in Retina Display'
S = 'Built-in Retina Display'
A = 'Built-in Retina Display'

# Prefer the external monitor.
# Fall back to the MacBook when the external monitor is absent.
1 = ['secondary', 'Built-in Retina Display']
2 = ['secondary', 'Built-in Retina Display']
3 = ['secondary', 'Built-in Retina Display']
4 = ['secondary', 'Built-in Retina Display']
5 = ['secondary', 'Built-in Retina Display']