# Sets the order of your prompt elements
format = """
$python\
$directory\
$git_branch\
$git_status\
$time\
$line_break\
$custom\
$character"""

# Shows your current Git branch
[git_branch]
symbol = ""
format = "on [$symbol $branch]($style) "
style = "bold white"

# Disables the untracked/modified files indicator entirely to remove [?]
[git_status]
disabled = true

# Places the virtual environment at the start explicitly wrapped in literal parentheses
[python]
disabled = false
format = '(\($virtualenv\) )'
style = "bold cyan"

# Enables the clock in 24-hour HH:MM format
[time]
disabled = false
format = "at [$time]($style) "
time_format = "%R" 
style = "bold yellow"

# Shows "ssh <ip>" right before ❯, only while on an SSH session.
# On the remote machine SSH_CONNECTION="<client-ip> <client-port> <server-ip> <server-port>",
# so field 3 is the IP you ssh'd into. Nothing renders locally (no SSH_CONNECTION).
[custom.ssh_ip]
command = "echo $SSH_CONNECTION | awk '{print $3}'"
when = "test -n \"$SSH_CONNECTION\""
format = "[ssh $output](bold red) "
description = "IP of the machine you ssh'd into"

# Customizes the prompt symbol
[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
